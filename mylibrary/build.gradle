plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.tzh.baselib"
    compileSdk 37

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    dataBinding {
        enabled = true
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.12.0'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    api 'com.geyifeng.immersionbar:immersionbar:3.3.3'

    api 'androidx.appcompat:appcompat:1.7.0'
    api 'androidx.constraintlayout:constraintlayout:2.2.2'
    api "com.google.code.gson:gson:2.14.0"

    api "androidx.recyclerview:recyclerview:1.4.0"

    //RxJava2.0+ retrofit2
    api 'com.uber.autodispose:autodispose:1.4.1'
    api 'com.uber.autodispose:autodispose-android-archcomponents:1.4.1'
    // rxandroid   (https://github.com/ReactiveX/RxAndroid)
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'
    //retrofit (https://github.com/square/retrofit)
    api 'com.squareup.retrofit2:retrofit:3.0.0'
    api 'com.squareup.retrofit2:adapter-rxjava2:3.0.0'
    api 'com.squareup.retrofit2:converter-gson:3.0.0'
    api 'io.reactivex.rxjava2:rxjava:2.2.21'
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //okttp  (https://github.com/square/okhttp)
    api 'com.squareup.okhttp3:okhttp:5.5.0'
    api 'com.squareup.okhttp3:logging-interceptor:5.5.0'

    api 'io.github.scwang90:refresh-layout-kernel:2.1.1'      //核心必须依赖
    api 'io.github.scwang90:refresh-header-classics:2.1.1'   //经典刷新头
    api 'io.github.scwang90:refresh-footer-classics:2.1.1'    //经典加载
    api 'io.github.scwang90:refresh-header-material:2.1.1'    //谷歌刷新头

    api 'com.github.bumptech.glide:glide:5.0.9'

    api 'com.guolindev.permissionx:permissionx:1.8.1'

    //banner
    api 'io.github.youth5201314:banner:2.2.3'
    
    //时间选择器和选项选择器
    api 'com.contrarywind:Android-PickerView:4.1.9'

    api 'com.github.angcyo.DslTablayout:TabLayout:3.7.1'
    //可选
    api 'com.github.angcyo.DslTablayout:ViewPager1Delegate:3.7.1'
    //可选
    api 'com.github.angcyo.DslTablayout:ViewPager2Delegate:3.7.1'


    api 'io.github.lucksiege:pictureselector:v3.11.1'
    api 'io.github.lucksiege:compress:v3.11.1'
    api 'io.github.lucksiege:ucrop:v3.11.1'

    api 'com.liulishuo.okdownload:okdownload:1.0.7'
    api 'com.liulishuo.okdownload:okhttp:1.0.7'

    //中英文转换框架
    api 'com.belerweb:pinyin4j:2.5.1'

    api 'androidx.cardview:cardview:1.0.0'
}
